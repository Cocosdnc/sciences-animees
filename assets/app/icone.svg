<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de l'app : un atome (noyau rouge laser, trois orbites, trois électrons) sur le fond du site. -->
  <defs>
    <radialGradient id="fond" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16202A"/>
      <stop offset="1" stop-color="#090D12"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#FF3D33" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#FF3D33" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FF3D33" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#fond)"/>
  <g fill="none" stroke="#E8EEF4" stroke-width="13" stroke-opacity=".82">
    <ellipse cx="256" cy="256" rx="184" ry="70"/>
    <ellipse cx="256" cy="256" rx="184" ry="70" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="184" ry="70" transform="rotate(120 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="96" fill="url(#halo)"/>
  <circle cx="256" cy="256" r="30" fill="#FF3D33"/>
  <circle cx="246" cy="246" r="10" fill="#FFD2CF" fill-opacity=".85"/>
  <circle cx="440" cy="256" r="17" fill="#3FD4A8"/>
  <circle cx="164" cy="97" r="17" fill="#A193FF"/>
  <circle cx="164" cy="415" r="17" fill="#5AA9FF"/>
</svg>
